project:
  type: website
  output-dir: _site
  resources:
    - images/motif.svg
    - images/social-card.png
  render:
    - "*.qmd"
    - "indicators/*.qmd"
    - "!docs/"

knitr:
  opts_chunk:
    dev: "ragg_png"
    fig.retina: 3

execute:
  freeze: false       # always re-run, so pages pick up changes to data files
  echo: false
  warning: false
  message: false

website:
  title: "State of Scotland's Seas"
  description: "An independent indicator report card for Scotland's seas, built from open data."
  site-url: https://emmabranch.github.io/scotland-seas-indicators
  repo-url: https://github.com/emmabranch/scotland-seas-indicators
  repo-actions: [source, issue]
  page-navigation: true
  open-graph:
    image: images/social-card.png
    image-alt: "State of Scotland's Seas: an independent indicator report card for Scotland's seas"
  twitter-card:
    image: images/social-card.png
  favicon: images/favicon.png
  navbar:
    logo: images/motif.svg
    logo-alt: ""
    left:
      - href: index.qmd
        text: Report card
      - text: Indicators
        menu:
          - href: indicators/seabirds.qmd
            text: "Seabirds after avian flu (deep dive)"
          - href: indicators/seabird-story.qmd
            text: "↳ The outbreak, colony by colony (story)"
          - href: indicators/seals.qmd
            text: "Seals"
          - href: indicators/salmon.qmd
            text: "Wild salmon"
          - href: indicators/sea-temperature.qmd
            text: "Sea temperature"
          - href: indicators/mpas.qmd
            text: "MPA coverage and 30x30"
      - href: framework.qmd
        text: Framework map
      - href: methods.qmd
        text: Methods
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/emmabranch/scotland-seas-indicators
        aria-label: GitHub repository
  page-footer:
    left: "Independent personal project by Emma Branch. Not affiliated with or endorsed by any organisation whose data is used."
    right: "Contains public sector information licensed under the [Open Government Licence v3.0](https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/)."

format:
  html:
    theme: [flatly, brand, brand.scss, styles/seas.scss]   # shared brand kit, then this site's colours
    include-after-body: footer.html
    toc: true
    toc-depth: 2
    fig-align: center
    fig-width: 9
    fig-height: 5
    fig-responsive: true
    lightbox: true
    smooth-scroll: true
    link-external-newwindow: true
